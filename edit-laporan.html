<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Laporan - Pantau Jalan Surabaya</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <div class="dashboard-nav">
                <div class="logo">
                    <i class="fas fa-road"></i>
                    <span>PantauJalan<span class="logo-highlight">Surabaya</span></span>
                </div>
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-info-text">
                        <div class="user-name">Pengguna</div>
                        <div class="user-role">Pengguna</div>
                    </div>
                    <button class="btn btn-outline logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-main">
        <div class="container">
            <div class="dashboard-grid">
                <div class="dashboard-sidebar">
                    <h3 style="margin-bottom: 20px;">Menu</h3>
                    <ul class="sidebar-menu">
                        <li><a href="dashboard-user.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                        <li><a href="laporan-baru.html"><i class="fas fa-plus-circle"></i> Buat Laporan</a></li>
                        <li><a href="daftar-laporan.html" class="active"><i class="fas fa-list"></i> Laporan Saya</a></li>
                        <li><a href="edit-profil.html"><i class="fas fa-user-edit"></i> Edit Profil</a></li>
                        <li><a href="index.html"><i class="fas fa-home"></i> Kembali ke Beranda</a></li>
                    </ul>
                </div>
                
                <div class="dashboard-content">
                    <h1 class="dashboard-title">Edit Laporan</h1>
                    <p>Perbarui informasi laporan kerusakan jalan Anda</p>
                    
                    <form id="editLaporanForm">
                        <div class="form-group">
                            <label for="judul_laporan" class="form-label">Judul Laporan *</label>
                            <input type="text" id="judul_laporan" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="lokasi_jalan" class="form-label">Lokasi Jalan *</label>
                            <input type="text" id="lokasi_jalan" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="kecamatan" class="form-label">Kecamatan *</label>
                            <select id="kecamatan" class="form-control" required>
                                <option value="">Pilih Kecamatan</option>
                                <option value="Asemrowo">Asemrowo</option>
                                <option value="Benowo">Benowo</option>
                                <option value="Bubutan">Bubutan</option>
                                <option value="Bulak">Bulak</option>
                                <option value="Dukuh Pakis">Dukuh Pakis</option>
                                <option value="Gayungan">Gayungan</option>
                                <option value="Genteng">Genteng</option>
                                <option value="Gubeng">Gubeng</option>
                                <option value="Gunung Anyar">Gunung Anyar</option>
                                <option value="Jambangan">Jambangan</option>
                                <option value="Karangpilang">Karangpilang</option>
                                <option value="Kenjeran">Kenjeran</option>
                                <option value="Krembangan">Krembangan</option>
                                <option value="Lakarsantri">Lakarsantri</option>
                                <option value="Mulyorejo">Mulyorejo</option>
                                <option value="Pabean Cantian">Pabean Cantian</option>
                                <option value="Pakal">Pakal</option>
                                <option value="Rungkut">Rungkut</option>
                                <option value="Sambikerep">Sambikerep</option>
                                <option value="Sawahan">Sawahan</option>
                                <option value="Semampir">Semampir</option>
                                <option value="Simokerto">Simokerto</option>
                                <option value="Sukolilo">Sukolilo</option>
                                <option value="Sukomanunggal">Sukomanunggal</option>
                                <option value="Tambaksari">Tambaksari</option>
                                <option value="Tandes">Tandes</option>
                                <option value="Tegalsari">Tegalsari</option>
                                <option value="Tenggilis Mejoyo">Tenggilis Mejoyo</option>
                                <option value="Wiyung">Wiyung</option>
                                <option value="Wonocolo">Wonocolo</option>
                                <option value="Wonokromo">Wonokromo</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="deskripsi_kerusakan" class="form-label">Deskripsi Kerusakan *</label>
                            <textarea id="deskripsi_kerusakan" class="form-control" rows="5" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="tingkat_kerusakan" class="form-label">Tingkat Kerusakan *</label>
                            <select id="tingkat_kerusakan" class="form-control" required>
                                <option value="">Pilih Tingkat Kerusakan</option>
                                <option value="ringan">Ringan</option>
                                <option value="sedang">Sedang</option>
                                <option value="berat">Berat</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="status" class="form-label">Status *</label>
                            <select id="status" class="form-control" required>
                                <option value="dikirim">Dikirim</option>
                                <option value="diproses">Diproses</option>
                                <option value="selesai">Selesai</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="foto" class="form-label">Foto Kerusakan</label>
                            <div class="upload-area">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Klik untuk upload foto baru</p>
                            </div>
                            <input type="file" id="foto" accept="image/*" style="display: none;">
                            <img id="preview-image" src="" alt="Preview" style="max-width: 100%; max-height: 300px; margin-top: 20px; border-radius: 8px; display: none;">
                        </div>
                        
                        <div class="form-group">
                            <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">Update Laporan</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
