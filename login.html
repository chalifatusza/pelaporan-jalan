<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pantau Jalan Surabaya</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <i class="fas fa-road"></i>
                    <span>PantauJalan<span class="logo-highlight">Surabaya</span></span>
                </div>
                <div class="nav-buttons">
                    <a href="index.html" class="btn btn-outline">Kembali ke Beranda</a>
                </div>
                <div class="hamburger">
                    <i class="fas fa-bars"></i>
                </div>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <h1 class="form-title">Masuk ke Akun Anda</h1>
                <p class="text-center" style="margin-bottom: 30px;">Belum punya akun? <a href="register.html" class="text-primary">Daftar disini</a></p>
                
                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username" class="form-label">Username</label> 
                        <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" autocomplete="new-username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" autocomplete="new-password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                            Masuk
                        </button>
                    </div>
                </form>
                
                <div style="text-align: center; margin: 20px 0; position: relative;">
                    <span style="background: white; padding: 0 10px; color: #6c757d; font-size: 0.9rem; position: relative; z-index: 1;">Atau masuk dengan</span>
                    <hr style="position: absolute; top: 50%; left: 0; right: 0; border: none; border-top: 1px solid #dee2e6; margin: 0; z-index: 0;">
                </div>

                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <button type="button" class="btn btn-outline" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #dadce0; background: white;" onclick="loginWithOAuth('google')">
                        <i class="fab fa-google" style="color: #ea4335;"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid #dadce0; background: white;" onclick="loginWithOAuth('github')">
                        <i class="fab fa-github" style="color: #333;"></i> GitHub
                    </button>
                </div>
                
                <div class="form-text text-center">
                    <a href="#" class="text-primary">Lupa password?</a>
                </div>
                
                <div class="demo-credentials" style="margin-top: 30px; padding: 15px; background-color: #f8f9fa; border-radius: 8px;">
                    <h3 style="font-size: 1rem; margin-bottom: 10px;"><i class="fas fa-info-circle"></i> Demo Credentials:</h3>
                    <p style="font-size: 0.9rem; margin-bottom: 5px;"><strong>Admin:</strong> username: <code>admin</code>, password: <code>admin123</code></p>
                    <p style="font-size: 0.9rem;"><strong>User:</strong> username: <code>user</code>, password: <code>user123</code></p>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
