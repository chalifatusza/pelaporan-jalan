<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Laporan - Pantau Jalan Surabaya</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <div class="dashboard-nav">
                <div class="logo">
                    <i class="fas fa-road"></i>
                    <span>PantauJalan<span class="logo-highlight">Surabaya</span></span>
                </div>
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-info-text">
                        <div class="user-name">Pengguna</div>
                        <div class="user-role">Pengguna</div>
                    </div>
                    <button class="btn btn-outline logout-btn">Logout</button>
                    <a href="daftar-laporan.html" class="btn btn-outline" style="margin-left: 10px;">Kembali</a>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-main">
        <div class="container">
            <div class="dashboard-content">
                <div id="loading" style="text-align: center; padding: 60px;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top: 15px;">Memuat detail laporan...</p>
                </div>
                
                <div id="laporanDetail" style="display: none;">
                    <!-- Data akan diisi oleh JavaScript -->
                </div>
                
                <div id="errorMessage" style="display: none; text-align: center; padding: 60px;">
                    <i class="fas fa-exclamation-triangle fa-3x" style="color: #dc3545; margin-bottom: 20px;"></i>
                    <h3>Laporan Tidak Ditemukan</h3>
                    <p style="margin-bottom: 30px; color: #6c757d;">Laporan yang Anda cari tidak tersedia atau telah dihapus.</p>
                    <a href="daftar-laporan.html" class="btn btn-primary">Kembali ke Daftar Laporan</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadLaporanDetail();
        });
        
        async function loadLaporanDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                showError();
                return;
            }
            
            try {
                const response = await fetch(`api.php?action=get_laporan_by_id&id=${id}`);
                const data = await response.json();
                
                if (data.success && data.data.laporan) {
                    displayLaporanDetail(data.data.laporan);
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error loading laporan detail:', error);
                showError();
            }
        }
        
        function displayLaporanDetail(laporan) {
            document.getElementById('loading').style.display = 'none';
            
            const container = document.getElementById('laporanDetail');
            const isAdmin = laporan.role === 'admin';
            
            const html = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <div>
                        <h1 class="dashboard-title">Detail Laporan</h1>
                        <p>ID: #${laporan.id} • ${formatDate(laporan.tanggal_laporan_formatted)}</p>
                    </div>
                    <div>
                        <a href="edit-laporan.html?id=${laporan.id}" class="btn btn-primary">
                            <i class="fas fa-edit"></i> Edit Laporan
                        </a>
                        <button class="btn btn-outline" onclick="window.print()" style="margin-left: 10px;">
                            <i class="fas fa-print"></i> Print
                        </button>
                    </div>
                </div>
                
                <div class="card" style="margin-bottom: 20px;">
                    <div class="card-header" style="background: linear-gradient(135deg, #020617 0%, #4A8BDF 100%); color: white;">
                        <h2 style="margin: 0; color: white;">${laporan.judul_laporan}</h2>
                    </div>
                    <div class="card-body">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px;">
                            <div>
                                <h3><i class="fas fa-info-circle"></i> Informasi Laporan</h3>
                                <table style="width: 100%; margin-top: 15px;">
                                    <tr>
                                        <td style="padding: 10px 0; width: 40%; border-bottom: 1px solid #e9ecef;"><strong>ID Laporan:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">#${laporan.id}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;"><strong>Tanggal Dibuat:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">${formatDate(laporan.tanggal_laporan_formatted)}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;"><strong>Status:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">
                                            <span class="status-badge status-${laporan.status}" style="font-size: 0.9rem;">
                                                ${laporan.status}
                                            </span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;"><strong>Tingkat Kerusakan:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">
                                            <span class="kerusakan-${laporan.tingkat_kerusakan} status-badge" style="font-size: 0.9rem;">
                                                ${laporan.tingkat_kerusakan}
                                            </span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0;"><strong>Terakhir Update:</strong></td>
                                        <td style="padding: 10px 0;">${laporan.tanggal_update_formatted ? formatDate(laporan.tanggal_update_formatted) : '-'}</td>
                                    </tr>
                                </table>
                            </div>
                            
                            <div>
                                <h3><i class="fas fa-map-marker-alt"></i> Lokasi Kerusakan</h3>
                                <table style="width: 100%; margin-top: 15px;">
                                    <tr>
                                        <td style="padding: 10px 0; width: 40%; border-bottom: 1px solid #e9ecef;"><strong>Alamat:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">${laporan.lokasi_jalan}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;"><strong>Kecamatan:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">${laporan.kecamatan}</td>
                                    </tr>
                                    <tr>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;"><strong>Koordinat:</strong></td>
                                        <td style="padding: 10px 0; border-bottom: 1px solid #e9ecef;">-</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                        
                        <div style="margin-bottom: 30px;">
                            <h3><i class="fas fa-file-alt"></i> Deskripsi Kerusakan</h3>
                            <div style="background: #f8f9fa; padding: 20px; border-radius: 5px; margin-top: 15px; line-height: 1.6;">
                                ${laporan.deskripsi_kerusakan.replace(/\n/g, '<br>')}
                            </div>
                        </div>
                        
                        ${laporan.foto_path ? `
                        <div style="margin-bottom: 30px;">
                            <h3><i class="fas fa-camera"></i> Foto Kerusakan</h3>
                            <div style="margin-top: 15px; text-align: center;">
                                <img src="${laporan.foto_path}" 
                                     alt="Foto Kerusakan" 
                                     style="max-width: 100%; max-height: 400px; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                                <p style="margin-top: 10px; color: #6c757d; font-size: 0.9rem;">Foto dokumentasi kerusakan jalan</p>
                            </div>
                        </div>
                        ` : ''}
                        
                        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #dee2e6;">
                            <h3><i class="fas fa-history"></i> Riwayat Status</h3>
                            <div style="margin-top: 15px;">
                                <div style="display: flex; align-items: center; margin-bottom: 15px;">
                                    <div style="width: 20px; height: 20px; background: #00DD00; border-radius: 50%; margin-right: 15px;"></div>
                                    <div>
                                        <strong>Laporan dibuat</strong>
                                        <div style="color: #6c757d; font-size: 0.9rem;">${formatDate(laporan.tanggal_laporan_formatted)}</div>
                                    </div>
                                </div>
                                ${laporan.tanggal_update_formatted ? `
                                <div style="display: flex; align-items: center;">
                                    <div style="width: 20px; height: 20px; background: #4A8BDF; border-radius: 50%; margin-right: 15px;"></div>
                                    <div>
                                        <strong>Terakhir diupdate</strong>
                                        <div style="color: #6c757d; font-size: 0.9rem;">${formatDate(laporan.tanggal_update_formatted)}</div>
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="card-footer" style="display: flex; justify-content: space-between;">
                        <div>
                            <button class="btn btn-outline" onclick="window.history.back()">
                                <i class="fas fa-arrow-left"></i> Kembali
                            </button>
                        </div>
                        <div>
                            <a href="edit-laporan.html?id=${laporan.id}" class="btn btn-primary">
                                <i class="fas fa-edit"></i> Edit Laporan
                            </a>
                            <button class="btn btn-outline" onclick="window.print()" style="margin-left: 10px;">
                                <i class="fas fa-print"></i> Print
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            container.style.display = 'block';
        }
        
        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
        }
        
        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('id-ID', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return dateString;
            }
        }
    </script>
</body>
</html>
